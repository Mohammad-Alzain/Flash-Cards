<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="adaptCardBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3730A3"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="adaptCardFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="adaptSpark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="adaptShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Transparent Background (Foreground layer only) -->
  <!-- Centered strictly inside Android's 66% safe zone (circle radius 338px around center 512, 512) -->
  <g transform="translate(256, 256) scale(1.0)">
    <!-- Back Stack Card (Tilted -10 deg) -->
    <rect x="116" y="80" width="280" height="352" rx="44" transform="rotate(-10 256 256)" fill="url(#adaptCardBack)" opacity="0.95" />
    
    <!-- Front Card with drop shadow -->
    <rect x="116" y="80" width="280" height="352" rx="44" fill="url(#adaptCardFront)" filter="url(#adaptShadow)" stroke="#818CF8" stroke-width="4" stroke-opacity="0.6"/>
    
    <!-- Center Synapse Spark -->
    <path d="M 256 168 Q 256 256 168 256 Q 256 256 256 344 Q 256 256 344 256 Q 256 256 256 168 Z" fill="url(#adaptSpark)"/>
    
    <!-- Satellite Energy Sparks -->
    <circle cx="340" cy="180" r="14" fill="#22D3EE"/>
    <circle cx="172" cy="332" r="10" fill="#A5F3FC" opacity="0.85"/>
  </g>
</svg>
