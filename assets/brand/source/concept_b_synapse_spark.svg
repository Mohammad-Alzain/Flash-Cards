<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="cardBackB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3730A3"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="cardFrontB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="sparkGradB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="shadowB" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Back Stack Card (Tilted 10 deg) -->
  <rect x="116" y="80" width="280" height="352" rx="44" transform="rotate(-10 256 256)" fill="url(#cardBackB)" opacity="0.9" />
  
  <!-- Front Card with soft drop shadow -->
  <rect x="116" y="80" width="280" height="352" rx="44" fill="url(#cardFrontB)" filter="url(#shadowB)" stroke="#818CF8" stroke-width="4" stroke-opacity="0.4"/>
  
  <!-- Center Synapse Spark (Geometric 4-point Star) -->
  <!-- Main vertical & horizontal diamond -->
  <path d="M 256 168 Q 256 256 168 256 Q 256 256 256 344 Q 256 256 344 256 Q 256 256 256 168 Z" fill="url(#sparkGradB)"/>
  
  <!-- Secondary Satellite Sparks (representing recall connections) -->
  <circle cx="340" cy="180" r="14" fill="#22D3EE"/>
  <circle cx="172" cy="332" r="10" fill="#A5F3FC" opacity="0.85"/>
</svg>
