<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="appBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0B0F19"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="appCardBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3730A3"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="appCardFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="appSpark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="appShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="32" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Opaque Background (Required for iOS App Store & Android Play Store) -->
  <rect width="1024" height="1024" fill="url(#appBgGrad)"/>
  <rect width="1024" height="1024" fill="url(#centerGlow)"/>

  <!-- Centered Synapse Spark Mark (Scaled to 640x640 at center x=192, y=192) -->
  <g transform="translate(192, 192) scale(1.25)">
    <!-- Back Stack Card (Tilted -10 deg) -->
    <rect x="116" y="80" width="280" height="352" rx="44" transform="rotate(-10 256 256)" fill="url(#appCardBack)" opacity="0.92" />
    
    <!-- Front Card with drop shadow -->
    <rect x="116" y="80" width="280" height="352" rx="44" fill="url(#appCardFront)" filter="url(#appShadow)" stroke="#818CF8" stroke-width="4" stroke-opacity="0.6"/>
    
    <!-- Center Synapse Spark -->
    <path d="M 256 168 Q 256 256 168 256 Q 256 256 256 344 Q 256 256 344 256 Q 256 256 256 168 Z" fill="url(#appSpark)"/>
    
    <!-- Satellite Energy Sparks -->
    <circle cx="340" cy="180" r="14" fill="#22D3EE"/>
    <circle cx="172" cy="332" r="10" fill="#A5F3FC" opacity="0.85"/>
  </g>
</svg>
