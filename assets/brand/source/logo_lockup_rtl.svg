<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240">
  <defs>
    <linearGradient id="rtlCardBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3730A3"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="rtlCardFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="rtlSpark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="rtlShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Mark on the Right (Scaled to 180x180 at x=590, y=30) -->
  <g transform="translate(590, 30) scale(0.3515)">
    <rect x="116" y="80" width="280" height="352" rx="44" transform="rotate(-10 256 256)" fill="url(#rtlCardBack)" opacity="0.92" />
    <rect x="116" y="80" width="280" height="352" rx="44" fill="url(#rtlCardFront)" filter="url(#rtlShadow)" stroke="#818CF8" stroke-width="3" stroke-opacity="0.5"/>
    <path d="M 256 168 Q 256 256 168 256 Q 256 256 256 344 Q 256 256 344 256 Q 256 256 256 168 Z" fill="url(#rtlSpark)"/>
    <circle cx="340" cy="180" r="14" fill="#22D3EE"/>
    <circle cx="172" cy="332" r="10" fill="#A5F3FC" opacity="0.85"/>
  </g>

  <!-- Typography RTL (Right-aligned text) -->
  <g transform="translate(560, 125)">
    <text text-anchor="end" font-family="Cairo, Tahoma, system-ui, -apple-system, sans-serif" font-weight="900" font-size="62" letter-spacing="-0.5">
      <tspan fill="#4F46E5">بطاقات</tspan> <tspan fill="#06B6D4">الاستذكار</tspan>
    </text>
    <text text-anchor="end" y="42" font-family="Cairo, Tahoma, system-ui, -apple-system, sans-serif" font-weight="700" font-size="16" letter-spacing="1" fill="#64748B">
      تكرار متباعد ذكي • متوافق مع Anki
    </text>
  </g>
</svg>
