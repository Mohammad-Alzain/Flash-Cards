<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="markCardBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3730A3"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="markCardFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="markSpark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="markShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Back Stack Card (Angled -10 deg) -->
  <rect x="116" y="80" width="280" height="352" rx="44" transform="rotate(-10 256 256)" fill="url(#markCardBack)" opacity="0.92" />
  
  <!-- Front Card with drop shadow and subtle border -->
  <rect x="116" y="80" width="280" height="352" rx="44" fill="url(#markCardFront)" filter="url(#markShadow)" stroke="#818CF8" stroke-width="3" stroke-opacity="0.5"/>
  
  <!-- Center Synapse Spark (Geometric 4-point Diamond Star) -->
  <path d="M 256 168 Q 256 256 168 256 Q 256 256 256 344 Q 256 256 344 256 Q 256 256 256 168 Z" fill="url(#markSpark)"/>
  
  <!-- Satellite Energy Sparks -->
  <circle cx="340" cy="180" r="14" fill="#22D3EE"/>
  <circle cx="172" cy="332" r="10" fill="#A5F3FC" opacity="0.85"/>
</svg>
