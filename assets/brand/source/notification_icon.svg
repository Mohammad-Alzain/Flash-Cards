<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Android Notification Silhouette Icon: Pure White on Transparent -->
  <!-- Mask to punch out the central spark from the front card -->
  <mask id="notifSparkMask">
    <rect width="96" height="96" fill="#FFFFFF"/>
    <!-- Cut-out center spark -->
    <path d="M 48 30 Q 48 48 32 48 Q 48 48 48 66 Q 48 48 64 48 Q 48 48 48 30 Z" fill="#000000"/>
    <circle cx="64" cy="32" r="3" fill="#000000"/>
  </mask>
  
  <!-- Back Stack Card (Tilted) -->
  <rect x="22" y="16" width="52" height="64" rx="8" transform="rotate(-10 48 48)" fill="#FFFFFF" opacity="0.6"/>
  
  <!-- Front Card with cut-out spark -->
  <rect x="22" y="16" width="52" height="64" rx="8" fill="#FFFFFF" mask="url(#notifSparkMask)"/>
</svg>
