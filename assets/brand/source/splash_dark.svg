<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="darkSplashGlow" cx="50%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="splashCardBackD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3730A3"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="splashCardFrontD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="splashSparkD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="splashShadowD" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Midnight Background matching Android #0B0F19 -->
  <rect width="1024" height="1024" fill="#0B0F19"/>
  <rect width="1024" height="1024" fill="url(#darkSplashGlow)"/>

  <!-- Centered Synapse Spark Mark (y shifted up slightly to balance wordmark) -->
  <g transform="translate(292, 190) scale(0.86)">
    <rect x="116" y="80" width="280" height="352" rx="44" transform="rotate(-10 256 256)" fill="url(#splashCardBackD)" opacity="0.95" />
    <rect x="116" y="80" width="280" height="352" rx="44" fill="url(#splashCardFrontD)" filter="url(#splashShadowD)" stroke="#818CF8" stroke-width="4" stroke-opacity="0.6"/>
    <path d="M 256 168 Q 256 256 168 256 Q 256 256 256 344 Q 256 256 344 256 Q 256 256 256 168 Z" fill="url(#splashSparkD)"/>
    <circle cx="340" cy="180" r="14" fill="#22D3EE"/>
    <circle cx="172" cy="332" r="10" fill="#A5F3FC" opacity="0.85"/>
  </g>

  <!-- Centered Luminous Wordmark -->
  <g transform="translate(512, 690)">
    <text text-anchor="middle" font-family="Nunito, system-ui, -apple-system, sans-serif" font-weight="900" font-size="60" letter-spacing="-1">
      <tspan fill="#818CF8">Flash</tspan><tspan fill="#22D3EE">Cards</tspan>
    </text>
    <text text-anchor="middle" y="44" font-family="Cairo, Tahoma, system-ui, -apple-system, sans-serif" font-weight="700" font-size="18" letter-spacing="3" fill="#94A3B8">
      تكرار متباعد ذكي • SMART RECALL
    </text>
  </g>
</svg>
