<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="splashCardBackL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3730A3"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="splashCardFrontL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="splashSparkL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="splashShadowL" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#4F46E5" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Clean Light Canvas -->
  <rect width="1024" height="1024" fill="#F8FAFC"/>

  <!-- Centered Synapse Spark Mark (y shifted up slightly to balance wordmark) -->
  <g transform="translate(292, 190) scale(0.86)">
    <rect x="116" y="80" width="280" height="352" rx="44" transform="rotate(-10 256 256)" fill="url(#splashCardBackL)" opacity="0.92" />
    <rect x="116" y="80" width="280" height="352" rx="44" fill="url(#splashCardFrontL)" filter="url(#splashShadowL)" stroke="#818CF8" stroke-width="3" stroke-opacity="0.5"/>
    <path d="M 256 168 Q 256 256 168 256 Q 256 256 256 344 Q 256 256 344 256 Q 256 256 256 168 Z" fill="url(#splashSparkL)"/>
    <circle cx="340" cy="180" r="14" fill="#22D3EE"/>
    <circle cx="172" cy="332" r="10" fill="#A5F3FC" opacity="0.85"/>
  </g>

  <!-- Centered Wordmark -->
  <g transform="translate(512, 690)">
    <text text-anchor="middle" font-family="Nunito, system-ui, -apple-system, sans-serif" font-weight="900" font-size="60" letter-spacing="-1">
      <tspan fill="#4F46E5">Flash</tspan><tspan fill="#06B6D4">Cards</tspan>
    </text>
    <text text-anchor="middle" y="44" font-family="Cairo, Tahoma, system-ui, -apple-system, sans-serif" font-weight="700" font-size="18" letter-spacing="3" fill="#64748B">
      تكرار متباعد ذكي • SMART RECALL
    </text>
  </g>
</svg>
